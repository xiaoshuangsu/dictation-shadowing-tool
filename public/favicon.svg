<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 蓝紫渐变 -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="512" height="512" rx="96" fill="url(#grad)"/>

  <!-- 白色书本图标 (Lucide BookOpen 风格) -->
  <g transform="translate(128, 128)">
    <!-- 左页 -->
    <path d="M 20 40 L 116 40 L 116 220 L 20 200 Z" fill="white"/>
    <!-- 右页 -->
    <path d="M 140 40 L 236 40 L 236 200 L 140 220 Z" fill="white"/>
    <!-- 书脊 -->
    <rect x="116" y="40" width="12" height="180" fill="#e0e7ff"/>
    <!-- 书本底部的书页效果 -->
    <path d="M 20 200 L 116 220 L 116 225 L 20 205 Z" fill="#e0e7ff"/>
    <path d="M 140 220 L 236 200 L 236 205 L 140 225 Z" fill="#e0e7ff"/>
  </g>
</svg>